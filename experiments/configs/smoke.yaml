# Fill the frozen artifact fields before validation. No credentials belong here.
schema_version: 1
experiment_id: terminal-bench-4-smoke
suite: ../suites/terminal-bench-4.yaml
subset: ../subsets/cpu-smoke.yaml
subject:
  commit: "<full Git commit>"
  package: "<absolute path outside repository to frozen npm archive>"
  sha256: "<archive SHA256>"
runtime:
  harbor_version: "0.24.0"
  pi_version: "1.4.0"
  node_version: "24.22.0"
model:
  provider: deepseek
  id: deepseek-flash
  api: openai-completions
  auth_profile: memweave-dev
  thinking: "off"
variants:
